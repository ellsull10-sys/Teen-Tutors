<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Session | Summit Tutoring</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Summit<span>Tutoring</span></a>
      <button class="nav-toggle" aria-label="Toggle Navigation">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="subjects.html">Subjects & Rates</a></li>
        <li><a href="contact.html">FAQ & Contact</a></li>
        <li><a href="book.html" class="btn btn-primary">Book Session</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1>Schedule & Pay for Your Session</h1>
      <p style="color: var(--text-muted); max-width: 600px; margin: 0 auto;">
        Pick an open slot on the calendar below. Card payment is required upon booking to confirm your spot.
      </p>
    </div>

    <div class="booking-frame-wrap">
      <!-- CAL.COM / CALENDLY EMBED START -->
      <!-- Replace 'YOUR_USERNAME/tutoring-session' with your live scheduler link -->
      <iframe 
        src="https://cal.com/YOUR_USERNAME/tutoring-session?embed=true" 
        style="width: 100%; height: 700px; border: none;" 
        frameborder="0">
      </iframe>
      <!-- EMBED END -->
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Summit Tutoring. All rights reserved.</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
